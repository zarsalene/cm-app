name: cm_app
description: CM mobile app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  material_ui: ^1.1.1

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo/icon_1024.png
    - assets/logo/wordmark.png
    - assets/logo/microzed.jpeg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/icon_1024.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo/icon_1024.png
  adaptive_icon_foreground_inset: 24
