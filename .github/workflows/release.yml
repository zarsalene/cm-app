name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload.jks
          EOF

      # Firebase config: without it the APK has no FCM push.
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build production APK
        run: >-
          flutter build apk --release --flavor production
          -t lib/main_production.dart
          --dart-define=CM_API_URL=${{ vars.CM_API_URL }}

      - name: Stage APK
        run: cp build/app/outputs/flutter-apk/app-production-release.apk Z-Smart-CM.apk

      # Tag push (v0.2.0, ...) -> GitHub Release avec l'APK en piece jointe.
      # L'APK est signe avec le keystore et embarque google-services.json (secrets),
      # donc push FCM actif. Sans ces secrets : cle debug et NoopPushService.
      - name: Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Z-Smart-CM.apk
          prerelease: true
          generate_release_notes: true

      # Lancement manuel (workflow_dispatch) -> artefact telechargeable sur la page de l'Action.
      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: Z-Smart-CM-apk
          path: Z-Smart-CM.apk
